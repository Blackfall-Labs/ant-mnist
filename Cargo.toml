[package]
name = "ant-mnist"
version = "0.1.0"
edition = "2021"
description = "LeNet-5 on MNIST — proving ground for Atomic Neural Transistors"
publish = false

[dependencies]
atomic-neural-transistors = { path = "../atomic-neural-transistors" }
ternary-signal = { path = "../ternary-signal" }
tiny_http = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "ant-mnist"
path = "src/main.rs"

[[bin]]
name = "ant-mnist-viz"
path = "src/viz.rs"
