[package]
name = "ant-mnist"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "LeNet-5 on MNIST — proving ground for Atomic Neural Transistors"
publish = false

[dependencies]
atomic-neural-transistors = { path = "../atomic-neural-transistors" }
ternary-signal = { path = "../ternary-signal" }
runes-core = { path = "../runes/runes-core" }
runes-parser = { path = "../runes/runes-parser" }
runes-eval = { path = "../runes/runes-eval" }
tiny_http = "0.12"
tungstenite = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"

[[bin]]
name = "ant-mnist"
path = "src/main.rs"

[[bin]]
name = "ant-mnist-viz"
path = "src/viz.rs"

[[bin]]
name = "flow-experiment"
path = "src/flow_experiment.rs"

[[bin]]
name = "lenet-experiment"
path = "src/lenet_experiment.rs"

[[bin]]
name = "lenet-sweep"
path = "src/lenet_sweep.rs"

[[bin]]
name = "lenet-ensemble"
path = "src/lenet_ensemble.rs"

[[bin]]
name = "lenet-thermal"
path = "src/lenet_thermal.rs"

[[bin]]
name = "voter-analysis"
path = "src/voter_analysis.rs"

[[bin]]
name = "lenet-dual-hemi"
path = "src/lenet_dual_hemi.rs"
